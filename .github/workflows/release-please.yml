name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        if: ${{ secrets.RELEASE_PLEASE_TOKEN != '' }}
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          release-type: simple
          target-branch: main
      - uses: googleapis/release-please-action@v4
        if: ${{ secrets.RELEASE_PLEASE_TOKEN == '' }}
        with:
          token: ${{ github.token }}
          release-type: simple
          target-branch: main
