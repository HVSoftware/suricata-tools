name: Lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bash syntax check
        run: bash -n scripts/*.sh tests/*.sh

      - name: ShellCheck
        run: shellcheck -e SC2009 scripts/*.sh tests/*.sh

      - name: Fixture-based jq checks
        run: make check
